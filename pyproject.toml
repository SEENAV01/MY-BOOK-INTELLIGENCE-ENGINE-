[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "my-book-intelligence-engine"
version = "0.0.1"
description = "Canonical integration repository for the My Book Intelligence Engine"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
